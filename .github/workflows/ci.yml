name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  formatting:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.c include/*.h

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -I include/ src/

  build-and-test:
    name: Build, Test & Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 valgrind
      - name: Build project
        run: make
      - name: Test CLI with Mock Server
        run: |
          python3 tests/mock_server.py --port 5353 &
          PID=$!
          sleep 1
          ./dns_cli -p 5353 example.com 127.0.0.1
          kill $PID
      - name: Memory leak check (Valgrind)
        run: |
          python3 tests/mock_server.py --port 5353 &
          PID=$!
          sleep 1
          valgrind --leak-check=full --error-exitcode=1 ./dns_cli -p 5353 example.com 127.0.0.1
          kill $PID
